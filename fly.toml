app = "digisocials-studio-django"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  PORT = "8080"
  STORAGE_BACKEND = "s3"

[deploy]
  release_command = "python manage.py migrate --noinput"

[processes]
  app = "gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 1 --threads 4"
  worker = "python manage.py run_studio_worker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health/"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
